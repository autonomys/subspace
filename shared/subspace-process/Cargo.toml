[package]
name = "subspace-process"
description = "Process scheduling and logging utilities for the Subspace network"
license = "0BSD"
version = "0.0.1"
authors = ["Nazar Mokrynskyi <nazar@mokrynskyi.com>", "Teor <teor@riseup.net>"]
edition.workspace = true
include = [
    "/src",
    "/Cargo.toml",
]

[dependencies]
# Substrate crates (and therefore their `console`-styled log messages) still link
# against console 0.15.x, whose color state is independent of console 0.16.x.
# Depend on both so `init_logger` can disable colors in each version's global state.
console.workspace = true
console-0-15 = { package = "console", version = "0.15.11" }
fdlimit.workspace = true
futures.workspace = true
supports-color.workspace = true
tokio = { workspace = true, features = ["parking_lot", "rt-multi-thread", "signal", "sync"] }
tracing.workspace = true
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros","parking_lot", "rt-multi-thread", "signal", "sync", "test-util"] }
